manifest_version = 2

[package]
name = "moonstone/love-importer"
version = "0.1.14"
kind = "bin"
description = "Import local LÖVE installations into normalized Moonstone runtime artifacts"

[origin]
kind = "git"
url = "https://github.com/moonstone-sh/love-importer"

[interpreter]
name = "lua"
version = "5.4"
abi = "5.4"

[scripts]
build = "lua scripts/build.lua"
export = "moon exec ballad play partiture.lua"
love-importer = "lua build/src/main.lua"
test = "python3 tests/native_lifecycle.py"

[[dependencies]]
name = "moonstone/clingy"
constraint = "^0.8.0"
role = "runtime"

[[dependencies]]
name = "moonstone/ballad"
constraint = "^0.4.6"
role = "tool"


[[dependencies]]
name = "dkjson"
constraint = "rocks:dkjson@^2.9-1"
role = "runtime"

[[dependencies]]
name = "moonscript"
constraint = "rocks:moonscript@^0.6.0-1"
role = "dev"

[[dependencies]]
name = "moonstone/valua"
constraint = "^0.2.6"
role = "runtime"
