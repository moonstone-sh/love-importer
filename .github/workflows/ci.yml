name: Love Importer CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    name: Native import and export (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: moonstone-sh/moonstone
          ref: 69d2859c80a8b3221e9368d6414ba11fdef486de
          path: .ci/moonstone
      - uses: actions/checkout@v4
        with:
          repository: moonstone-sh/ballad
          ref: af29ad4224bcd7ec48c371154fbc3b46fb29a9e5
          path: .ci/ballad
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install POSIX archive tooling
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            sudo apt-get install -y b3sum zstd zip unzip
          else
            brew install b3sum zstd
          fi
      - name: Build Moonstone
        working-directory: .ci/moonstone
        run: |
          zig build
          echo "$GITHUB_WORKSPACE/.ci/moonstone/zig-out/bin" >> "$GITHUB_PATH"
      - name: Provision portable exporter and project dependencies
        run: |
          moon remove moonstone/ballad --no-sync
          moon add "path:$GITHUB_WORKSPACE/.ci/ballad" --tool --no-sync
          moon sync
      - name: Verify imports, managed installation, and relocated launchers
        run: python tests/native_lifecycle.py
